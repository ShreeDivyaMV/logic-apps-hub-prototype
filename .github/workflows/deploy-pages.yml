name: Deploy Logic Apps Hub to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            single-logic-app-hub/package-lock.json
      - name: Install multi-app hub dependencies
        run: npm ci
      - name: Build multi-app hub
        run: npm run build
      - name: Install single-app hub dependencies
        working-directory: single-logic-app-hub
        run: npm ci
      - name: Build single-app hub
        working-directory: single-logic-app-hub
        run: npm run build
      - name: Assemble Pages site
        run: |
          mkdir -p pages/single-logic-app-hub
          cp -R dist/. pages/
          cp -R single-logic-app-hub/dist/. pages/single-logic-app-hub/
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
